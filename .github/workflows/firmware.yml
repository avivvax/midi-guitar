name: Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
  workflow_dispatch:

jobs:
  test-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detector unit tests (host)
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/midi_guitar firmware/test/test_detector.cpp -o test_detector
          ./test_detector
      - name: Compile for ESP32-S3
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - name: NimBLE-Arduino
              version: 2.5.1
          sketch-paths: |
            - firmware/midi_guitar
          cli-compile-flags: |
            - --warnings
            - all
